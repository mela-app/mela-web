name: web-ci

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b (typecheck, tests included), then the bundle the share page loads.
      - run: npm run build
      - name: The share page's fixed file names are there
        run: test -f dist/player.js && test -f dist/player.css
