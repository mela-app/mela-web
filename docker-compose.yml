# The web player's container, locally - the image production uses. With .env
# in place (copy .env.example):
#
#   docker compose up -d --build
#
# The player's files are served under /web/ on http://localhost:<WEB_PORT>
# (e.g. http://localhost:8081/web/?stream=<live id>). In production the API's
# share page (/live/:id) loads them from the same origin - see
# infra/production in mela-backend.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mela-web:local
    restart: unless-stopped
    # This machine only.
    ports:
      - "127.0.0.1:${WEB_PORT:?set WEB_PORT in .env}:8080"
