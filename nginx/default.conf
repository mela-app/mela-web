# The web player's files, under /web/ - nothing else. The page that loads
# them, and its Content-Security-Policy, come from the API (/live/:id).
server {
    listen 9005;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Every response. A location with an add_header of its own would drop
    # these, so the locations below set caching with `expires` instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed file names (the video SDKs among them): safe to cache for a year.
    location /web/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # player.js and player.css keep their names, so they're revalidated on
    # every visit: a new deploy shows up at once.
    location /web/ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
